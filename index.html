<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        form,
        #orderSummary {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        #productsContainer {
            margin-top: 20px;
        }

        #productsContainer > div {
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        #productsContainer h3 {
            margin-top: 0;
        }

        #calculateBtn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #calculateBtn:hover {
            background: #444;
        }

        #validationMessage {
            max-width: 700px;
            margin: 15px auto;
            color: #c62828;
            font-weight: bold;
        }

        #orderSummary {
            margin-top: 20px;
        }

        #orderSummary h2 {
            margin-top: 0;
        }

        #orderSummary p {
            line-height: 1.6;
        }
    </style>

    <script src="script.js" defer></script>
</head>

<body>

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <form id="checkoutForm">

        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName">

        <label for="productCount">Number of Products</label>
        <input type="number" id="productCount" min="1">

        <div id="productsContainer"></div>

        <label for="deliveryOption">Delivery Option</label>
        <select id="deliveryOption">
            <option value="1">Store Pickup</option>
            <option value="2">Standard Delivery</option>
            <option value="3">Express Delivery</option>
        </select>

        <button type="button" id="calculateBtn">Calculate Order</button>

    </form>

    <p id="validationMessage"></p>

    <div id="orderSummary"></div>

</body>
</html>
