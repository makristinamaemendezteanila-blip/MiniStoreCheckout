<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        button {
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        #validationMessage {
            color: red;
            margin-top: 15px;
        }

        #orderSummary {
            margin-top: 25px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <label for="customerName">Customer Name</label>
    <input type="text" id="customerName" placeholder="Enter customer name">

    <label for="productCount">Number of Products</label>
    <input type="number" id="productCount" min="1" placeholder="Enter number of products">

    <div id="productsContainer"></div>


    <label for="deliveryOption">Delivery Option</label>
    <select id="deliveryOption">
        <option value="1">Store Pickup</option>
        <option value="2">Standard Delivery</option>
        <option value="3">Express Delivery</option>
    </select>

    <div id="validationMessage"></div>

    <button type="button" id="calculateBtn">Calculate Order</button>

    <div id="orderSummary"></div>

</div>
<script src="script.js"></script>

</body>
</html>
